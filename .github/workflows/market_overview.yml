name: Automated Market Overview Snapshot

on:
  schedule:
    # Korea close: 16:30 KST = 07:30 UTC
    - cron: "30 7 * * 1-5"
    # US close: 07:30 KST (22:30 UTC previous day)
    - cron: "30 22 * * 1-5"
  push:
    paths:
      - "market_overview.py"
      - ".github/workflows/market_overview.yml"
      - "MARKET_OVERVIEW_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect market overview snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python market_overview.py
