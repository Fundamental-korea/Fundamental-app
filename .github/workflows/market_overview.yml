name: Automated Market Overview Snapshot

on:
  schedule:
    # Korea market close: 16:00 KST = 07:00 UTC
    - cron: "0 7 * * 1-5"
    # US market close: 05:30 KST = 20:30 UTC previous day
    - cron: "30 20 * * 1-5"
  push:
    paths:
      - "market_overview.py"
      - ".github/workflows/market_overview.yml"
      - "MARKET_OVERVIEW_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect market overview snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 7 * * 1-5")
                echo "[MARKET_OVERVIEW] Korea schedule -> KR"
                python market_overview.py --market KR
                ;;
              "30 20 * * 1-5")
                echo "[MARKET_OVERVIEW] US schedule -> US"
                python market_overview.py --market US
                ;;
              *)
                echo "[MARKET_OVERVIEW] Unknown schedule -> BOTH"
                python market_overview.py
                ;;
            esac
          else
            echo "[MARKET_OVERVIEW] Manual/push run -> BOTH"
            python market_overview.py
          fi
