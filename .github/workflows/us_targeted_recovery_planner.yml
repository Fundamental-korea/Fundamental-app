name: US Targeted Recovery Planner

on:
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: "Completed canonical inventory workflow run ID"
        required: true
        default: "36232189823"
  push:
    paths:
      - "collector_us_recovery_planner.py"
      - ".github/workflows/us_targeted_recovery_planner.yml"

permissions:
  contents: read
  actions: read

jobs:
  planner:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_RECOVERY_PLANNER]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INVENTORY_RUN_ID: ${{ github.event.inputs.inventory_run_id || '36232189823' }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download canonical inventory report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/inventory
          mkdir -p /tmp/inventory
          gh run download "$INVENTORY_RUN_ID"             -R "$GITHUB_REPOSITORY"             -n us-canonical-field-inventory-report             -D /tmp/inventory
          test -s /tmp/inventory/us_canonical_field_inventory.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install planner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests yfinance

      - name: Build targeted recovery worklists
        run: |
          set -euo pipefail
          python collector_us_recovery_planner.py             --inventory-json /tmp/inventory/us_canonical_field_inventory.json             --out-dir /tmp/recovery_planner

      - name: Upload recovery plan
        uses: actions/upload-artifact@v4
        with:
          name: us-targeted-recovery-plan
          path: |
            /tmp/recovery_planner/us_recovery_planner_summary.json
            /tmp/recovery_planner/us_recovery_planner_summary.txt
            /tmp/recovery_planner/us_404_priority_queue.csv
            /tmp/recovery_planner/us_component_recovery_worklist.csv
            /tmp/recovery_planner/us_targeted_missing_fields.csv
          if-no-files-found: error
