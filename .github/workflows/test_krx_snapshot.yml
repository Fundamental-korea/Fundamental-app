name: Test KRX Market Snapshot

on:
  push:

jobs:
  test-krx:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: KRX read-only smoke test
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python test_krx_snapshot.py
