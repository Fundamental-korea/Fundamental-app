name: Test KRX Market Snapshot

on:
  push:

jobs:
  test-krx:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: pip install -r requirements.txt

      - name: KRX read-only smoke test
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python test_krx_snapshot.py

      - name: DART direct API vs OpenDartReader diagnostic (read only)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python test_dart_direct_vs_reader.py

      - name: DART raw stock-total diagnostic (read only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python diagnose_dart_stock_total.py

      - name: Supabase 3-stock live DB test
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python test_krx_db_update.py

      - name: DART + KRX financial 3-stock test
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python test_krx_financial_3stock.py
