name: US Score Metadata Backfill

on:
  push:
    paths:
      - "US_SCORE_METADATA_TRIGGER.txt"
  workflow_run:
    workflows: ["US Score Gap Recovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional maximum number of rows"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: us-score-metadata-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run metadata backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          limit="${{ inputs.limit }}"
          if [ -n "$limit" ]; then
            python backfill_us_score_metadata.py --limit "$limit"
          else
            python backfill_us_score_metadata.py
          fi
