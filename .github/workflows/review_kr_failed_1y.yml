name: Korean Failed 1Y Review

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/kor-market-snapshot
    paths:
      - review_kor_failed_1y.py
      - .github/workflows/review_kr_failed_1y.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Review remaining failures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python review_kor_failed_1y.py
