name: Apply Live News Performance Patch

on:
  push:
    paths:
      - ".github/workflows/_apply_live_news_performance_patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-live-news-performance-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted Live News fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py")
          text = app.read_text(encoding="utf-8")

          # 1) Replace the AI image URL builder only.
          start_marker = 'def _get_ai_news_image_url(title: str, description: str = "", query: str = "") -> str:\n'
          end_marker = '\ndef _build_news_reader_url(\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("AI image function boundaries not found")

          new_ai = '''def _get_ai_news_image_url(title: str, description: str = "", query: str = "") -> str:
              """대표 이미지가 없을 때 기사 주제에 맞는 고해상도 AI 편집 일러스트 URL을 만든다.
              브라우저에서 직접 이미지를 요청하므로 서버에 이미지 파일을 저장하지 않는다."""
              key = f"{title}|{description}|{query}"
              seed = int(hashlib.sha256(key.encode("utf-8")).hexdigest()[:8], 16)

              visual_styles = (
                  "cinematic financial newsroom photography with trading screens and market data atmosphere",
                  "editorial macroeconomics illustration with bonds, currency, rates and global market imagery",
                  "high-end business magazine photography focused on the companies or industries in the story",
                  "realistic geopolitical economy editorial scene with trade, industry and global markets context",
                  "modern technology and semiconductor financial editorial photography with realistic depth and lighting",
                  "energy and commodities market editorial photography with realistic materials, infrastructure and dramatic light",
              )
              visual_style = visual_styles[seed % len(visual_styles)]
              topic = (description or title or query or "financial markets").strip()[:420]

              prompt = (
                  "Create a premium high-resolution 16:9 editorial image for a professional financial news website. "
                  "Photorealistic, crisp fine details, realistic lighting, natural depth, clean composition, "
                  "journalistic visual storytelling. No readable text, no watermarks, no logos, no charts with fake text, "
                  "and no recognizable real people. Avoid generic repeated stock-photo layouts. "
                  f"Visual style: {visual_style}. "
                  f"News topic to visualize: {topic}. "
                  f"Category/context: {query or 'financial markets'}."
              )
              return (
                  "https://gen.pollinations.ai/image/"
                  + quote(prompt, safe="")
                  + f"?model=flux-2-klein-4b&width=1536&height=864&seed={seed}&nologo=true&enhance=true"
              )

'''
          text = text[:start] + new_ai + text[end:]

          # 2) Insert a cheap URL-only image quality check. Network probing here
          #    was a major source of page latency.
          quality_marker = 'def _news_image_quality_ok(image_url: str) -> bool:\n'
          quality_pos = text.find(quality_marker)
          if quality_pos < 0:
              raise SystemExit("image quality function not found")

          hint_helper = '''def _news_image_url_hint_ok(image_url: str) -> bool:
              """이미지 URL 문자열만 검사한다. 네트워크 요청은 하지 않아 카드 로딩을 막지 않는다."""
              url = str(image_url or "").strip().lower()
              if not url.startswith(("http://", "https://")):
                  return False
              lowres_hints = (
                  "thumbnail", "thumb", "small", "tiny", "lowres",
                  "150x", "180x", "200x", "240x", "300x", "320x", "400x",
                  "width=150", "width=180", "width=200", "width=240",
                  "width=300", "width=320", "width=400",
                  "w_150", "w_180", "w_200", "w_240", "w_300", "w_320", "w_400",
              )
              if any(hint in url for hint in lowres_hints):
                  return False
              try:
                  parsed = urlparse(url)
                  if (
                      "bing.com" in parsed.netloc
                      and ("th=" in parsed.query or parsed.path.rstrip("/").endswith("/th"))
                  ):
                      return False
              except Exception:
                  return False
              return True


'''
          text = text[:quality_pos] + hint_helper + text[quality_pos:]

          # 3) Use URL-only checks when selecting extracted/provider images.
          text = text.replace(
              "            if _news_image_quality_ok(image_url):\n                return image_url\n",
              "            if _news_image_url_hint_ok(image_url):\n                return image_url\n",
              1,
          )
          text = text.replace(
              "            if candidate_image and _news_image_quality_ok(candidate_image):\n",
              "            if candidate_image and _news_image_url_hint_ok(candidate_image):\n",
              1,
          )

          # 4) Make _get_news_images skip URLs that already have a usable provider image.
          old_images = '''def _get_news_images(urls):
              urls = [str(u or "") for u in urls]
              if not urls:
                  return []
              # 현재 화면에 표시할 카드 전체에 대해 원문 대표 이미지를 확인한다.
              # 병렬 조회로 로딩 시간을 관리하고, 실패 시 공급원 썸네일을 사용한다.
              results = [""] * len(urls)
              lookup_count = len(urls)
              lookup_urls = [(idx, urls[idx]) for idx in range(lookup_count) if urls[idx]]
              if not lookup_urls:
                  return results
              with ThreadPoolExecutor(max_workers=min(6, len(lookup_urls))) as executor:
                  fetched = executor.map(lambda pair: (pair[0], _get_news_image_url(pair[1])), lookup_urls)
                  for idx, image_url in fetched:
                      results[idx] = image_url
              return results
'''
          if old_images not in text:
              raise SystemExit("_get_news_images block not found")

          new_images = '''def _get_news_images(urls, provided_urls=None):
              """공급원 이미지가 이미 있으면 즉시 사용하고, 없는 카드만 원문 페이지를 조회한다."""
              urls = [str(u or "") for u in urls]
              provided = [str(u or "") for u in (provided_urls or [])]
              if not urls:
                  return []

              results = [""] * len(urls)
              for idx in range(min(len(urls), len(provided))):
                  if _news_image_url_hint_ok(provided[idx]):
                      results[idx] = provided[idx]

              lookup_urls = [
                  (idx, urls[idx])
                  for idx in range(len(urls))
                  if urls[idx] and not results[idx]
              ]
              if not lookup_urls:
                  return results

              # 원문 HTML 조회가 필요한 카드만 병렬 조회한다. 4개 정도면
              # 외부 사이트 부하를 줄이면서도 화면 응답시간을 안정적으로 유지한다.
              with ThreadPoolExecutor(max_workers=min(4, len(lookup_urls))) as executor:
                  fetched = executor.map(
                      lambda pair: (pair[0], _get_news_image_url(pair[1])),
                      lookup_urls,
                  )
                  for idx, image_url in fetched:
                      results[idx] = image_url
              return results
'''
          text = text.replace(old_images, new_images, 1)

          # 5) Pass provider images so the expensive article lookup is skipped for them.
          old_call = "    image_urls = _get_news_images(article_urls)\n"
          new_call = '''    provided_image_urls = [
          getattr(item, "image_url", "") for item in selected_items
      ]
      image_urls = _get_news_images(article_urls, provided_image_urls)
'''
          if old_call not in text:
              raise SystemExit("image lookup call not found")
          text = text.replace(old_call, new_call, 1)

          # 6) Avoid ugly broken-image glyphs. Show static fallback, then a neutral
          #    placeholder if even the fallback URL fails.
          old_media = '''            media_html = (
                f'<div class="live-news-image-wrap">'
                f'<img class="live-news-image" src="{_escape_html(image_url)}" loading="lazy" '
                f'alt="{_escape_html(display_title)}" onerror="this.onerror=null;this.src=\\'{_escape_html(AI_NEWS_FALLBACK_IMAGE_URL)}\\';">'
                f'</div>'
            )
'''
          new_media = '''            media_html = (
                f'<div class="live-news-image-wrap">'
                f'<img class="live-news-image" src="{_escape_html(image_url)}" loading="lazy" decoding="async" '
                f'alt="{_escape_html(display_title)}" '
                f'onerror="this.onerror=function(){{this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';}};'
                f'this.src=\'{_escape_html(AI_NEWS_FALLBACK_IMAGE_URL)}\';">'
                f'<div class="live-news-image-error" style="display:none;">📰<small>이미지 불러오기 실패</small></div>'
                f'</div>'
            )
'''
          if old_media not in text:
              raise SystemExit("media HTML block not found")
          text = text.replace(old_media, new_media, 1)

          app.write_text(text, encoding="utf-8")

          # 7) Touch only the Live News schedule file so the merge/push causes
          #    an immediate collector run in addition to the hourly watchdog.
          wf = Path(".github/workflows/live_news_refresh.yml")
          wf_text = wf.read_text(encoding="utf-8")
          marker = "    # Hourly watchdog. collect_live_news.py enforces the ~2h minimum interval.\n"
          replacement = "    # Hourly watchdog. collect_live_news.py enforces the ~2h minimum interval.\n    # The workflow file is also touched by visual patches to force an immediate refresh after deploy.\n"
          if marker not in wf_text:
              raise SystemExit("live news schedule marker not found")
          wf.write_text(wf_text.replace(marker, replacement, 1), encoding="utf-8")

          print("Applied targeted Live News image-speed, image-fallback, and refresh-trigger patch")
          PY

      - name: Validate syntax
        run: |
          python -m py_compile app.py news_earnings.py collect_live_news.py
          git diff --check

      - name: Remove temporary patch workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/live_news_refresh.yml
          git rm .github/workflows/_apply_live_news_performance_patch.yml
          git commit -m "fix: stabilize live news images and refresh"
          git push
