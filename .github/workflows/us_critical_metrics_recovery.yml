name: US Critical Metrics Filing Recovery

on:
  push:
    paths:
      - "US_CRITICAL_METRICS_TRIGGER.txt"
      - "collector_us_fundamental.py"
      - "collector_us_critical_recover.py"
      - "sec_filing_financial_map.py"
      - "sec_xbrl_search_v2_*.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "Companies to process (default 100, 0 = all targets)"
        required: false
        default: "100"
        type: string
      all_targets:
        description: "Process every current non-utility target"
        required: false
        default: false
        type: boolean
      tickers:
        description: "Optional comma-separated tickers"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: us-critical-metrics-filing-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run critical metric recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          LIMIT="${{ inputs.limit || '100' }}"
          TICKERS="${{ inputs.tickers || '' }}"
          ALL_TARGETS="${{ inputs.all_targets || 'false' }}"
          if [ -n "$TICKERS" ]; then
            python collector_us_critical_recover.py --tickers "$TICKERS"
          elif [ "$ALL_TARGETS" = "true" ] || [ "$LIMIT" = "0" ]; then
            python collector_us_critical_recover.py --all
          else
            python collector_us_critical_recover.py --limit "$LIMIT"
          fi
