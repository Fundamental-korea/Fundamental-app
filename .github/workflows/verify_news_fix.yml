name: Verify news fix

on:
  push:
    branches:
      - diag/verify-news-fix

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify Korean fallback translation and stock-news routes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, re
          from streamlit.testing.v1 import AppTest

          def run_route(code):
              at = AppTest.from_file("app.py", default_timeout=180)
              at.secrets["SUPABASE_URL"] = os.environ.get("SUPABASE_URL", "")
              at.secrets["SUPABASE_KEY"] = os.environ.get("SUPABASE_KEY", "")
              at.secrets["MARKETAUX_API_TOKEN"] = os.environ.get("MARKETAUX_API_TOKEN", "")
              at.query_params["code"] = code
              at.run()
              assert not at.exception, [e.value for e in at.exception]
              html_nodes = at.get("html")
              blobs = [
                  str(getattr(node, "value", "") or getattr(node, "body", "") or "")
                  for node in html_nodes
              ]
              html = "\n".join(x for x in blobs if "live-news-card" in x)
              titles = re.findall(r'<div class="live-news-title">(.*?)</div>', html)
              print("ROUTE", code, "CARDS", len(titles))
              print("TITLES", titles)
              assert len(titles) >= 3
              return titles

          kr_titles = run_route("005930")
          us_titles = run_route("NVDA")
          assert any(re.search(r"[가-힣]", t) for t in us_titles), us_titles
          assert any("삼성전자" in t or re.search(r"[가-힣]", t) for t in kr_titles), kr_titles
          PY
      - name: Compile
        run: python -m py_compile app.py news_earnings.py collect_live_news.py
