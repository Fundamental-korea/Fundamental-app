name: US Production Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/us_production_preflight.yml"
      - "US_PREFLIGHT_TARGETS.txt"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests supabase pandas yfinance lxml

      - name: Run production collector preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set -euo pipefail
          TICKERS=$(paste -sd, US_PREFLIGHT_TARGETS.txt)
          COUNT=$(grep -cve '^\s*$' US_PREFLIGHT_TARGETS.txt)
          echo "Preflight target count: $COUNT"
          test "$COUNT" -eq 150
          python collector_us_fundamental.py --tickers "$TICKERS"
