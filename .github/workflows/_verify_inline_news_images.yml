name: Verify inline Live News images

on:
  push:
    paths:
      - ".github/workflows/_verify_inline_news_images.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.txt
      - name: Streamlit AppTest image smoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import sys
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=90)
          at.run(timeout=90)
          print("EXCEPTIONS", len(at.exception))
          if at.exception:
              print(at.exception[0])
              sys.exit(1)

          html_nodes = [x for x in at.html if "live-news-grid" in getattr(x, "value", "")]
          print("LIVE_NEWS_HTML_NODES", len(html_nodes))
          if not html_nodes:
              sys.exit("Live News grid not rendered")

          html = "\n".join(getattr(x, "value", "") for x in html_nodes)
          svg_count = html.count("<svg")
          img_count = html.count("<img")
          print("SVG_COUNT", svg_count, "IMG_COUNT", img_count)
          if svg_count < 1:
              sys.exit("No inline SVG fallback was rendered")
          print("INLINE_NEWS_IMAGE_SMOKE_OK")
          PY
