name: US CompanyFacts Zero-Exact Diagnostic

on:
  push:
    paths:
      - "collector_us_companyfacts_zero_exact_diagnostic.py"
      - ".github/workflows/us_companyfacts_zero_exact_diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INVENTORY_RUN_ID: "36232189823"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download canonical inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/inventory
          mkdir -p /tmp/inventory
          gh run download "$INVENTORY_RUN_ID" -R "$GITHUB_REPOSITORY"             -n us-canonical-field-inventory-report -D /tmp/inventory
          test -s /tmp/inventory/us_canonical_field_inventory.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Diagnose zero-exact companies
        run: |
          set -euo pipefail
          python collector_us_companyfacts_zero_exact_diagnostic.py             --inventory-json /tmp/inventory/us_canonical_field_inventory.json             --out-dir /tmp/zero_exact

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: us-zero-exact-diagnostic
          path: /tmp/zero_exact/
          if-no-files-found: error
