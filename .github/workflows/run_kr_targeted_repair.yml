name: Korean Targeted Repair

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/kor-market-snapshot
    paths:
      - repair_kor_stocks.py
      - .github/workflows/run_kr_targeted_repair.yml

permissions:
  contents: read

concurrency:
  group: kr-targeted-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair selected Korean stocks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run targeted repair
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python repair_kor_stocks.py
