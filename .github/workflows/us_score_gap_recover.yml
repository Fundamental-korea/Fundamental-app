name: US Score Gap Recovery

on:
  workflow_run:
    workflows: ["US Missing Metrics Recovery 4-9"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recover score gaps
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector_us_score_gap_recover.py

      - name: Verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          sb=create_client(os.environ["SUPABASE_URL"],os.environ["SUPABASE_KEY"])
          q=sb.table("US_Fundamental").select("ticker",count="exact",head=True).eq("data_unavailable",False).is_("total_score","null").execute()
          print(f"score_null={q.count}")
          PY
