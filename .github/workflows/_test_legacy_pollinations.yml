name: Test legacy Pollinations endpoint

on:
  push:
    paths:
      - ".github/workflows/_test_legacy_pollinations.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          for base in "https://image.pollinations.ai/prompt" "https://gen.pollinations.ai/image"; do
            url="${base}/financial%20news%20global%20markets?width=800&height=250&seed=1&nologo=true"
            code="$(curl -L -sS -o /tmp/test -w '%{http_code}' --max-time 60 "$url" || true)"
            echo "$base HTTP=$code SIZE=$(stat -c%s /tmp/test 2>/dev/null || echo 0)"
            head -c 80 /tmp/test || true
            echo
          done
