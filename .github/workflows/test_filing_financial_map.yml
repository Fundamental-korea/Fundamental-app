name: Test Filing Financial Map

on:
  push:
    paths:
      - "sec_filing_financial_map.py"
      - "test_sec_filing_financial_map.py"
      - "sec_xbrl_search_v2_3_*.py"
      - "sec_xbrl_inline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q test_sec_filing_financial_map.py
