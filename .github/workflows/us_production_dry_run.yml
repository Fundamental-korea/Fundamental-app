name: US Production Collector Dry Run
on:
  workflow_dispatch:
  push:
    paths:
      - "collector_us_production_dry_run.py"
      - ".github/workflows/us_production_dry_run.yml"
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install requests lxml supabase pandas yfinance
      - name: Run dry run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector_us_production_dry_run.py
