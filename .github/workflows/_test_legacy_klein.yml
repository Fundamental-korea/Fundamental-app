name: Test legacy Pollinations Klein

on:
  push:
    paths:
      - ".github/workflows/_test_legacy_klein.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          url='https://image.pollinations.ai/prompt/financial%20news%20global%20markets%20banner?model=klein&width=1600&height=480&seed=123&nologo=true&enhance=true'
          code="$(curl -L -sS -o /tmp/test.jpg -w '%{http_code}' --max-time 90 "$url")"
          echo "HTTP=$code SIZE=$(stat -c%s /tmp/test.jpg)"
          file /tmp/test.jpg
          test "$code" = "200"
