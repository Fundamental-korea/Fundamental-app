name: Validate Korea Market Snapshot

concurrency:
  group: kor-market-snapshot-validation
  cancel-in-progress: true

on:
  push:
    paths:
      - "validate_kor_market_snapshot.py"
      - ".github/workflows/validate_kor_market_snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 검증 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance

      - name: 상위 100개 교차검증
        env:
          TARGET_DATE: "2026-09-18"
          VALIDATION_INPUT: "validation_results/kor_top100_2026-09-18.json"
        run: python validate_kor_market_snapshot.py

      - name: 결과 파일 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_results/kor_snapshot_validation_latest.json validation_results/kor_snapshot_validation_latest.md
          git diff --cached --quiet || git commit -m "Add Korea market snapshot validation result"
          git push
