name: KRX Step 3 - Diagnose 52 Missing Snapshots

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only KRX raw response diagnostic
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python diagnose_krx_52_missing.py
