name: Earnings Calendar Collector

on:
  workflow_dispatch:
  push:
    paths:
      - "EARNINGS_COLLECTOR_TRIGGER.txt"
      - "collector_earnings_calendar.py"
  schedule:
    # Weekly refresh: Monday 02:15 UTC = Monday 11:15 KST
    - cron: "15 2 * * 1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect earnings calendar
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector_earnings_calendar.py
