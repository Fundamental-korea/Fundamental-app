name: US >$5B Filing Recovery V3

on:
  push:
    paths:
      - "collector_us_gt5b_filing_recovery_v3.py"
      - ".github/workflows/us_gt5b_filing_recovery_v3.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: us-gt5b-filing-recovery-v3
  cancel-in-progress: true

jobs:
  filing_recovery:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[RUN_GT5B_RECOVERY]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLANNER_RUN_ID: "36236938416"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download recovery planner queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/planner
          mkdir -p /tmp/planner
          gh run download "$PLANNER_RUN_ID" -R "$GITHUB_REPOSITORY"             -n us-targeted-recovery-plan -D /tmp/planner
          test -s /tmp/planner/us_404_priority_queue.csv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests supabase lxml

      - name: Recover >$5B CompanyFacts-404 filings
        run: |
          set -euo pipefail
          python collector_us_gt5b_filing_recovery_v3.py             --queue-csv /tmp/planner/us_404_priority_queue.csv             --bucket over_5b             --expected-targets 166             --out-dir /tmp/filing_recovery

      - name: Upload recovery result
        uses: actions/upload-artifact@v4
        with:
          name: us-gt5b-filing-recovery-v3
          path: /tmp/filing_recovery/us_gt5b_filing_recovery_v3.json
          if-no-files-found: error
