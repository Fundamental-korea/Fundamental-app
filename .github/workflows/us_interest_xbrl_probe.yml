name: US Interest XBRL Probe
on:
  workflow_dispatch:
  push:
    paths: ["probe_us_interest_xbrl.py", "US_INTEREST_PROBE_TRIGGER.txt"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python probe_us_interest_xbrl.py "${{ secrets.SEC_USER_AGENT }}" | tee probe_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: us-interest-xbrl-probe
          path: probe_output.txt
          retention-days: 7
