name: US Filing Presence Pilot v2

on:
  workflow_dispatch:
  push:
    paths:
      - "collector_us_filing_presence_pilot.py"
      - ".github/workflows/us_filing_presence_pilot.yml"

permissions:
  contents: read

concurrency:
  group: us-filing-presence-pilot-v2
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase lxml
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector_us_filing_presence_pilot.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: us-filing-presence-pilot-v2
          path: artifacts/us_filing_presence_pilot_v2.json
          retention-days: 14
