name: Daily Fundamental Data Auto-Update

on:
  schedule:
    # 매일 UTC 0시 (한국 시간 오전 9시)에 자동 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHub 웹에서 수동으로도 즉시 실행 가능

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 1y 지표 자동 갱신 스크립트 실행
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python update_1y.py
