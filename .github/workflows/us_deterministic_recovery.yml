name: US Deterministic Score Recovery

on:
  push:
    branches:
      - feat/us-company-universe-census
    paths:
      - "collector_us_deterministic_recovery.py"
      - "collector_us_fundamental.py"
      - "us_scoring.py"
      - ".github/workflows/us_deterministic_recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-deterministic-recovery
  cancel-in-progress: true

jobs:
  deterministic_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install supabase requests pandas

      - name: Run deterministic recovery for 1-3 missing metrics
        run: |
          set -euo pipefail
          python collector_us_deterministic_recovery.py             --min-missing 1             --max-missing 3

