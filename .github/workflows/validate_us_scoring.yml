name: Validate US Scoring System

on:
  push:
    paths:
      - "app.py"
      - "collector_us_fundamental.py"
      - "us_scoring.py"
      - "test_us_scoring.py"
      - "chart_indicators.py"
      - "historical_pattern.py"
      - "test_historical_pattern.py"
      - "test_chart_indicators.py"
      - "search_aliases.py"
      - "test_us_recovery.py"
      - "collector_us_snapshot_recover.py"
      - "test_us_snapshot.py"
      - "collector_us_roic_recover.py"
      - "collector_us_standard_fallback.py"
      - "us_classification.py"
      - "test_us_classification.py"
      - "backfill_us_score_metadata.py"
      - "us_valuation.py"
      - "collector_us_valuation_all.py"
      - "test_us_valuation.py"
      - "test_us_filing_recovery.py"
      - ".github/workflows/validate_us_scoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile changed Python modules
        run: python -m py_compile app.py collector_us_fundamental.py collector_us_standard_fallback.py collector_us_utility_v4.py collector_us_full_recollect.py collector_us_recover_unupdated.py collector_us_snapshot_recover.py collector_us_roic_recover.py collector_us_valuation_all.py us_scoring.py us_classification.py backfill_us_score_metadata.py us_valuation.py chart_indicators.py historical_pattern.py search_aliases.py test_us_scoring.py test_us_classification.py test_historical_pattern.py test_chart_indicators.py test_us_recovery.py test_us_snapshot.py test_us_valuation.py

      - name: Run regression tests
        run: |
          python -m unittest -v test_us_scoring.py test_us_classification.py test_historical_pattern.py test_chart_indicators.py test_us_recovery.py test_us_valuation.py
          pytest -q test_us_filing_recovery.py
