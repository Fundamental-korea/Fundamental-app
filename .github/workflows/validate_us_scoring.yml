name: Validate US Scoring System

on:
  push:
    paths:
      - "app.py"
      - "collector_us_fundamental.py"
      - "us_scoring.py"
      - "test_us_scoring.py"
      - ".github/workflows/validate_us_scoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile changed Python modules
        run: python -m py_compile app.py collector_us_fundamental.py collector_us_standard_fallback.py collector_us_utility_v4.py collector_us_full_recollect.py us_scoring.py test_us_scoring.py

      - name: Run US scoring regression tests
        run: python -m unittest -v test_us_scoring.py
