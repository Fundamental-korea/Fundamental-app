name: KRX Step 5 - Production Market Map Diagnostic

on:
  push:
    branches:
      - refactor/kor-market-snapshot
    paths:
      - .github/krx_step5_trigger.txt
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run read-only production market-map diagnostic
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python diagnose_krx_market_map.py
