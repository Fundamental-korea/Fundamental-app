name: KRX Full Production Run (2,876 Korean Stocks)

on:
  # IMPORTANT: never run the full 2,876-stock production job on ordinary pushes.
  # Run it explicitly from GitHub Actions when a full refresh is intended.
  workflow_dispatch:

jobs:
  full-production:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full production KRX/DART update
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_dart.py
