name: Korean Valuation Similarity Validation

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/kor-market-snapshot
    paths:
      - validate_kr_valuation_similarity.py
      - collector.py
      - kor_market_pipeline.py
      - .github/workflows/run_kr_valuation_similarity_validation.yml

permissions:
  contents: read

concurrency:
  group: kr-valuation-similarity
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Naver-style Korean valuation sample
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run valuation similarity validation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python validate_kr_valuation_similarity.py
