name: Korean DART Benchmark Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/kor-market-snapshot
    paths:
      - diagnose_kr_naver_similarity.py
      - .github/workflows/diagnose_kr_naver_similarity.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run DART benchmark diagnostic
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python diagnose_kr_naver_similarity.py
