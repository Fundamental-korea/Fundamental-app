name: US Canonical Inventory Remerge

on:
  push:
    paths:
      - ".github/workflows/us_canonical_inventory_remerge.yml"
      - "collector_us_canonical_field_inventory.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  remerge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: "36218573290"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install merge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests supabase

      - name: Download successful inventory artifacts from source run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/canonical_inventory

          curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100"             -o /tmp/artifacts.json

          python - <<'PY'
          import json, os, pathlib
          payload=json.load(open("/tmp/artifacts.json", encoding="utf-8"))
          wanted=sorted(
              a for a in payload.get("artifacts", [])
              if a.get("name","").startswith("canonical-inventory-")
              and not a.get("expired", False)
          )
          print(f"source_run={os.environ['SOURCE_RUN_ID']} artifacts={len(wanted)}")
          if len(wanted) != 14:
              raise SystemExit(f"Expected 14 canonical inventory artifacts, found {len(wanted)}")
          with open("/tmp/artifact_ids.tsv","w",encoding="utf-8") as fh:
              for a in wanted:
                  fh.write(f"{a['id']}	{a['name']}
")
          PY

          while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME; do
            echo "Downloading $ARTIFACT_NAME ($ARTIFACT_ID)"
            curl -fsSL -L               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip"               -o "/tmp/$ARTIFACT_NAME.zip"
            mkdir -p "/tmp/canonical_inventory/$ARTIFACT_NAME"
            unzip -oq "/tmp/$ARTIFACT_NAME.zip" -d "/tmp/canonical_inventory/$ARTIFACT_NAME"
            cp /tmp/canonical_inventory/$ARTIFACT_NAME/*.json "/tmp/canonical_inventory/"
          done < /tmp/artifact_ids.tsv

          ls -lh /tmp/canonical_inventory/batch-*.json

      - name: Merge inventory
        run: |
          set -euo pipefail
          python collector_us_canonical_field_inventory.py merge             --input-dir /tmp/canonical_inventory             --out-json /tmp/us_canonical_field_inventory.json             --out-txt /tmp/us_canonical_field_inventory.txt

      - name: Upload final canonical inventory report
        uses: actions/upload-artifact@v4
        with:
          name: us-canonical-field-inventory-final
          path: |
            /tmp/us_canonical_field_inventory.json
            /tmp/us_canonical_field_inventory.txt
          if-no-files-found: error
