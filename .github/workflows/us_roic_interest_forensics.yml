name: US ROIC Interest Forensics

on:
  push:
    paths:
      - "US_ROIC_INTEREST_FORENSICS_TRIGGER.txt"
      - "us_roic_interest_forensics_full.py"
      - "diagnose_us_roic_interest.py"
  workflow_dispatch:
    inputs:
      inline_per_reason:
        description: "Inline-XBRL sample size per failure reason"
        required: false
        default: "15"
        type: string
      inline_max:
        description: "Maximum Inline-XBRL companies inspected"
        required: false
        default: "240"
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full-universe forensic census
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python us_roic_interest_forensics_full.py \
            --inline-per-reason "${{ inputs.inline_per_reason || '15' }}" \
            --inline-max "${{ inputs.inline_max || '240' }}"

      - name: Upload forensic report
        uses: actions/upload-artifact@v4
        with:
          name: us-roic-interest-forensics-full
          path: |
            us_roic_interest_forensics_full.json
            us_roic_interest_forensics_full.txt
          retention-days: 14
