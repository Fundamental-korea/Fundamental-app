name: Verify Supabase news image URLs

on:
  push:
    paths:
      - ".github/workflows/_verify_news_topic_images.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          base="https://cnweggechipghcivruie.supabase.co/storage/v1/object/public/news-topic-images"
          for name in global_markets interest_rates bonds_yields dollar_fx energy_oil ai_semiconductors trade_global korea_asia economy_jobs crypto_assets; do
            url="${base}/${name}.jpg"
            code="$(curl -L -sS -o /tmp/${name}.jpg -w '%{http_code}' --max-time 20 "$url")"
            size="$(stat -c%s /tmp/${name}.jpg)"
            echo "${name}: HTTP=${code} bytes=${size}"
            test "${code}" = "200"
            test "${size}" -gt 10000
          done
          echo "SUPABASE_NEWS_TOPIC_IMAGES_OK"
