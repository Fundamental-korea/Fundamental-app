name: US Standard Fundamental Data Auto-Update

on:
  schedule:
    # 매일 UTC 01:00 (한국 시간 오전 10시)에 SEC 신규 filing 확인
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-us-updater:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v7

      - name: Python 환경 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: SEC filing 기반 미국 Standard 증분 업데이트
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python update_us_standard.py
