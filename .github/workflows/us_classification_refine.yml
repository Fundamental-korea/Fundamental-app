name: US Classification Refinement

on:
  push:
    paths:
      - "US_CLASSIFICATION_TRIGGER.txt"
  workflow_run:
    workflows: ["US Missing Metrics Recovery 4-9"]
    types: [completed]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the conservative refinement (true/false)"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  refine:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run classification refinement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          apply="${{ inputs.apply }}"
          if [ -z "$apply" ]; then
            apply="true"
          fi
          if [ "$apply" = "true" ]; then
            python rescore_us_classification.py --apply
          else
            python rescore_us_classification.py
          fi
