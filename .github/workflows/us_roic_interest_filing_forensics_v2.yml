name: US ROIC Interest Filing Forensics V2

on:
  push:
    paths:
      - "US_ROIC_INTEREST_FILING_FORENSICS_V2_TRIGGER.txt"
      - "us_roic_interest_filing_forensics_v2.py"
      - "sec_filing_financial_map.py"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional company limit"
        required: false
        default: ""
        type: string
      start:
        description: "Starting offset"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  filing-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run filing-first forensic collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONUNBUFFERED: "1"
        run: |
          python us_roic_interest_filing_forensics_v2.py \
            --start "${{ inputs.start || '0' }}" \
            ${{ inputs.limit && format('--limit "{0}"', inputs.limit) || '' }}

      - name: Upload filing forensic report
        uses: actions/upload-artifact@v4
        with:
          name: us-roic-interest-filing-forensics-v2
          path: |
            us_roic_interest_filing_forensics_v2.json
            us_roic_interest_filing_forensics_v2.txt
          retention-days: 14
