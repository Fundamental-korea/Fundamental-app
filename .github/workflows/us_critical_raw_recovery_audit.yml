name: US Critical Raw Recovery Audit
on:
  workflow_dispatch:
  push:
    paths:
      - "collector_us_critical_raw_recovery_audit.py"
      - ".github/workflows/us_critical_raw_recovery_audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase lxml
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector_us_critical_raw_recovery_audit.py
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: us-critical-raw-recovery-audit
          path: artifacts/us_critical_raw_recovery_audit_v1.json
          retention-days: 14
