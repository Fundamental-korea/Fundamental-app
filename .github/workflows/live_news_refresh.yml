name: Live News Auto Refresh

on:
  push:
    paths:
      - "news_earnings.py"
      - "collect_live_news.py"
      - ".github/workflows/live_news_refresh.yml"
  schedule:
    # Every 2 hours, UTC.
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: python -m py_compile app.py news_earnings.py collect_live_news.py

      - name: Smoke test Korean and US stock news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          SUPABASE_URL: https://cnweggechipghcivruie.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -c "from news_earnings import fetch_stock_news; kr=fetch_stock_news('삼성전자','005930',3); us=fetch_stock_news('NVIDIA','NVDA',3); print('[STOCK SMOKE] KR 삼성전자={} US NVIDIA={}'.format(len(kr),len(us))); raise SystemExit(1) if not kr or not us else None"

      - name: Collect today's Live News into Supabase
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          SUPABASE_URL: https://cnweggechipghcivruie.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect_live_news.py