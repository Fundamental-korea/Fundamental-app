name: Live News Auto Refresh

on:
  push:
    paths:
      - "news_earnings.py"
      - "collect_live_news.py"
      - ".github/workflows/live_news_refresh.yml"
  schedule:
    # Hourly watchdog. collect_live_news.py enforces the ~2h minimum interval.
    # Workflow changes also trigger an immediate collection after a deployment patch.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-news-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python modules
        run: python -m py_compile app.py news_earnings.py collect_live_news.py

      - name: Smoke test Korean and US stock news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          SUPABASE_URL: https://cnweggechipghcivruie.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python -c "from news_earnings import fetch_stock_news; import sys; kr=fetch_stock_news('삼성전자','005930',3); us=fetch_stock_news('NVIDIA','NVDA',3); print('[STOCK SMOKE] KR 삼성전자={} US NVIDIA={}'.format(len(kr),len(us))); sys.exit(1 if not kr or not us else 0)"

      - name: Collect today's Live News into Supabase
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          SUPABASE_URL: https://cnweggechipghcivruie.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collect_live_news.py