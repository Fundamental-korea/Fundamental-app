name: News system diagnostic

on:
  push:
    branches:
      - diag/news-system

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diagnose Gemini translation endpoint
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_MODEL: ${{ secrets.GEMINI_NEWS_MODEL }}
        run: |
          python - <<'PY'
          import os, requests, json
          key=os.environ.get("GEMINI_API_KEY","").strip()
          model=os.environ.get("GEMINI_NEWS_MODEL","").strip() or "gemini-3.5-flash-lite"
          print("GEMINI_KEY_PRESENT=", bool(key))
          print("GEMINI_MODEL=", model)
          prompt='''Translate this financial headline into natural Korean.
          1. Federal Reserve keeps interest rates unchanged'''
          for version in ("v1beta","v1"):
              url=f"https://generativelanguage.googleapis.com/{version}/models/{model}:generateContent"
              try:
                  r=requests.post(url,headers={"x-goog-api-key":key,"Content-Type":"application/json"},json={"contents":[{"parts":[{"text":prompt}]}],"generationConfig":{"maxOutputTokens":100}},timeout=30)
                  print("ENDPOINT",version,"STATUS",r.status_code)
                  print("BODY",r.text[:1000])
              except Exception as e:
                  print("ENDPOINT",version,"ERROR",type(e).__name__,e)
          PY
      - name: Diagnose Korean stock news
        env:
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          from news_earnings import fetch_stock_news
          for name,code in [("삼성전자","005930"),("SK하이닉스","000660"),("NVIDIA","NVDA")]:
              try:
                  items=fetch_stock_news(name,code,3)
                  print("STOCK",name,code,"COUNT",len(items))
                  for x in items:
                      print("  ",repr(x.title),repr(x.source),repr(x.link),repr(x.pub_date))
              except Exception as e:
                  print("STOCK",name,code,"ERROR",type(e).__name__,e)
          PY
      - name: Diagnose Korean stock news in Streamlit route
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          MARKETAUX_API_TOKEN: ${{ secrets.MARKETAUX_API_TOKEN }}
        run: |
          mkdir -p .streamlit
          printf 'SUPABASE_URL="%s"\nSUPABASE_KEY="%s"\nMARKETAUX_API_TOKEN="%s"\n' "$SUPABASE_URL" "$SUPABASE_KEY" "$MARKETAUX_API_TOKEN" > .streamlit/secrets.toml
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=120)
          at.query_params["code"] = "005930"
          at.run()
          print("APP_EXCEPTION_COUNT", len(at.exception))
          for e in at.exception[:10]:
              print("APP_EXCEPTION", e.value)
          texts = [getattr(x, "value", "") for x in at.markdown]
          print("MARKDOWN_COUNT", len(texts))
          for x in texts:
              if "뉴스" in str(x) or "삼성전자" in str(x):
                  print("MARKDOWN_NEWS", repr(x)[:1200])
          print("HAS_STOCK_NEWS_HEADING", any("삼성전자 관련 뉴스" in str(x) for x in texts))
          html_nodes = at.get("html")
          print("HTML_NODE_COUNT", len(html_nodes))
          for node in html_nodes:
              body = str(getattr(node, "value", "") or getattr(node, "body", "") or "")
              if "live-news-card" in body or "삼성전자 관련 뉴스" in body:
                  print("HTML_NEWS_NODE", body[:5000])
          if at.exception:
              raise SystemExit(1)
          if not any("관련 뉴스" in str(x) for x in texts):
              raise SystemExit(2)
          PY
      - name: Test public translation fallback
        run: |
          python - <<'PY'
          import requests
          text = "Federal Reserve keeps interest rates unchanged"
          r = requests.get(
              "https://translate.googleapis.com/translate_a/single",
              params={"client":"gtx","sl":"en","tl":"ko","dt":"t","q":text},
              timeout=20,
          )
          print("TRANSLATE_STATUS", r.status_code)
          print("TRANSLATE_BODY", r.text[:1000])
          print("PUBLIC_FALLBACK_TEST_ONLY", r.status_code == 200)
          PY

      - name: Test MyMemory translation fallback
        run: |
          python - <<'PY'
          import requests
          text = "Federal Reserve keeps interest rates unchanged"
          r = requests.get(
              "https://api.mymemory.translated.net/get",
              params={"q": text, "langpair": "en|ko"},
              timeout=20,
          )
          print("MYMEMORY_STATUS", r.status_code)
          print("MYMEMORY_BODY", r.text[:1500])
          if r.status_code != 200:
              raise SystemExit(1)
          data = r.json()
          translated = str(data.get("responseData", {}).get("translatedText", "")).strip()
          if not translated:
              raise SystemExit(2)
          PY

      - name: Compile
        run: python -m py_compile app.py news_earnings.py collect_live_news.py