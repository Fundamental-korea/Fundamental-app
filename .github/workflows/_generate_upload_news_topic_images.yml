name: Generate and upload Live News topic images

on:
  push:
    paths:
      - ".github/workflows/_generate_upload_news_topic_images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is missing"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }

      - name: Generate Gemini 3.1 Flash images and upload to Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import base64, io, os, time
          from pathlib import Path

          import requests
          from PIL import Image, ImageFilter
          from supabase import create_client

          MODEL = "gemini-3.1-flash-image"
          API_URL = "https://generativelanguage.googleapis.com/v1beta/interactions"
          OUT = Path("generated_news_topic_images")
          OUT.mkdir(exist_ok=True)

          topics = {
            "global_markets": "Wide cinematic editorial financial-news banner for global stock markets and the world economy. Photorealistic modern financial district at blue hour, glowing world market map, stock candlestick displays and trading atmosphere, premium institutional finance magazine style, deep navy and electric blue with refined warm gold highlights, cinematic realistic lighting, extremely crisp detail, sophisticated, no people, no readable text, no logos, no border.",
            "interest_rates": "Wide cinematic editorial financial-news banner for interest rates and central banks. Photorealistic neoclassical central bank building, elegant percentage-rate concept, subtle yield curve and market data in the scene, premium institutional finance magazine style, deep navy and cobalt with warm amber sunlight, crisp realistic detail, no people, no readable text, no logos, no border.",
            "bonds_yields": "Wide cinematic editorial financial-news banner for bonds and Treasury yields. Photorealistic U.S. Treasury securities, fountain pen, investment coins, subtle bond-yield chart, premium institutional finance magazine style, dark navy steel blue and warm gold, crisp macro detail, realistic depth, no people, no readable text, no logos, no border.",
            "dollar_fx": "Wide cinematic editorial financial-news banner for the U.S. dollar and foreign exchange. Photorealistic U.S. dollar bills, elegant abstract currency symbols, glowing FX market screens and exchange chart, premium institutional finance magazine style, deep blue and cyan with refined gold highlights, crisp detail and realistic reflections, no people, no readable text, no logos, no border.",
            "energy_oil": "Wide cinematic editorial financial-news banner for oil, energy and commodities. Photorealistic oil pumpjacks, refinery infrastructure, oil barrels at golden hour, subtle commodity price chart, premium business magazine photography, rich amber sunset with deep blue shadows, crisp realistic detail, no people, no readable text, no logos, no border.",
            "ai_semiconductors": "Wide cinematic editorial financial-news banner for AI and semiconductors. Photorealistic premium semiconductor chip on a modern circuit board, glowing data pathways and subtle technology market chart, deep blue and cyan with warm highlights, ultra-crisp micro detail, premium technology-finance magazine style, no people, no readable text, no logos, no border.",
            "trade_global": "Wide cinematic editorial financial-news banner for global trade and the world economy. Photorealistic container ship at a major port with cranes and stacked containers, subtle glowing logistics map and routes, premium financial newspaper photography, blue ocean and steel with warm industrial light, crisp realistic detail, no people, no readable text, no logos, no border.",
            "korea_asia": "Wide cinematic editorial financial-news banner for Korea and Asia markets. Photorealistic Seoul skyline at dusk with N Seoul Tower and a subtle Korean flag, Asian financial market ambience and faint chart overlays, premium business magazine style, rich navy violet and warm sunset tones, crisp realistic detail, no people, no readable text, no logos, no border.",
            "economy_jobs": "Wide cinematic editorial financial-news banner for the economy, consumers and employment. Photorealistic shopping cart with groceries, modern retail environment, stacks of coins and subtle rising economic chart, premium macroeconomics magazine style, warm amber and deep blue contrast, crisp realistic detail, no people, no readable text, no logos, no border.",
            "crypto_assets": "Wide cinematic editorial financial-news banner for digital assets and cryptocurrency markets. Photorealistic Bitcoin coin, digital-asset market chart, glowing blockchain network and gold coins, premium institutional finance magazine style, deep navy and electric blue with warm gold highlights, crisp macro detail and realistic reflections, no people, no readable text, no logos, no border.",
          }

          sb = create_client(os.environ["SUPABASE_URL"].rstrip("/"), os.environ["SUPABASE_SERVICE_ROLE_KEY"])
          bucket = "news-topic-images"
          session = requests.Session()
          headers = {"x-goog-api-key": os.environ["GEMINI_API_KEY"], "Content-Type": "application/json"}

          for topic, prompt in topics.items():
            print(f"=== {topic} ===")
            payload = {
              "model": MODEL,
              "input": prompt,
              "response_format": {
                "type": "image",
                "mime_type": "image/jpeg",
                "aspect_ratio": "4:1",
                "image_size": "2K",
              },
            }
            last_error = None
            for attempt in range(1, 4):
              try:
                r = session.post(API_URL, headers=headers, json=payload, timeout=180)
                if not r.ok:
                  raise RuntimeError(f"Gemini HTTP {r.status_code}: {r.text[:800]}")
                body = r.json()
                image_b64 = ((body.get("output_image") or {}).get("data") or "")
                if not image_b64:
                  for item in body.get("output", []) or []:
                    if isinstance(item, dict) and item.get("type") == "image" and item.get("data"):
                      image_b64 = item["data"]
                      break
                if not image_b64:
                  raise RuntimeError("No image data in Gemini response")
                raw = base64.b64decode(image_b64)
                image = Image.open(io.BytesIO(raw)).convert("RGB")

                target_w, target_h = 1600, 480
                target_ratio = target_w / target_h
                src_ratio = image.width / image.height
                if src_ratio > target_ratio:
                  new_w = round(image.height * target_ratio)
                  left = max(0, (image.width - new_w) // 2)
                  image = image.crop((left, 0, left + new_w, image.height))
                elif src_ratio < target_ratio:
                  new_h = round(image.width / target_ratio)
                  top = max(0, (image.height - new_h) // 2)
                  image = image.crop((0, top, image.width, top + new_h))
                image = image.resize((target_w, target_h), Image.Resampling.LANCZOS)
                image = image.filter(ImageFilter.UnsharpMask(radius=0.8, percent=110, threshold=3))

                out_file = OUT / f"{topic}.jpg"
                image.save(out_file, "JPEG", quality=94, optimize=True, progressive=True)
                data = out_file.read_bytes()

                sb.storage.from_(bucket).upload(
                  f"{topic}.jpg",
                  data,
                  file_options={"content-type": "image/jpeg", "cache-control": "31536000", "upsert": "true"},
                )
                public_url = sb.storage.from_(bucket).get_public_url(f"{topic}.jpg")
                sb.table("news_topic_images").upsert({
                  "topic_key": topic,
                  "storage_path": f"{topic}.jpg",
                  "public_url": public_url,
                  "width": target_w,
                  "height": target_h,
                  "model": MODEL,
                }, on_conflict="topic_key").execute()
                print(f"UPLOADED {topic} bytes={len(data)}")
                break
              except Exception as exc:
                last_error = exc
                print(f"attempt {attempt} failed: {exc}")
                if attempt < 3:
                  time.sleep(5 * attempt)
            else:
              raise SystemExit(f"{topic} failed after 3 attempts: {last_error}")

          print("DONE: 10/10 topic images uploaded to Supabase Storage.")
          PY
