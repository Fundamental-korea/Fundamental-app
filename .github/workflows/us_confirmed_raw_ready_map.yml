name: US Confirmed Raw-Ready Filing Map Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - "collector_us_confirmed_raw_ready_map.py"
      - ".github/workflows/us_confirmed_raw_ready_map.yml"
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - run: pip install requests lxml
      - name: Run diagnostic
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python collector_us_confirmed_raw_ready_map.py
