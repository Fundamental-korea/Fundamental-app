name: US Standard ROIC Recovery

on:
  push:
    paths:
      - "US_ROIC_TRIGGER.txt"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional maximum number of ROIC-missing Standard companies"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ROIC recovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ inputs.limit }}" ]; then
            python collector_us_roic_recover.py --limit "${{ inputs.limit }}"
          else
            python collector_us_roic_recover.py
          fi
