name: US Missing Metrics Recovery 4-9

on:
  push:
    paths:
      - "US_MISSING_4_9_TRIGGER.txt"
  workflow_run:
    workflows: ["US Standard ROIC Recovery"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional maximum number of Standard 4-9 missing companies"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: us-missing-metrics-4-9-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recover Standard metrics 4-9
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          LIMIT="${{ inputs.limit || '0' }}"
          if [ "$LIMIT" = "0" ]; then
            python collector_us_missing_4_9_recover.py
          else
            python collector_us_missing_4_9_recover.py --limit "$LIMIT"
          fi

      - name: Verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          sb=create_client(os.environ["SUPABASE_URL"],os.environ["SUPABASE_KEY"])
          for lo,hi in [(0,0),(1,3),(4,9)]:
              q=sb.table("US_Fundamental").select("ticker",count="exact",head=True).eq("data_unavailable",False).gte("missing_metric_count",lo).lte("missing_metric_count",hi).execute()
              print(f"missing={lo}-{hi}: {q.count}")
          PY
