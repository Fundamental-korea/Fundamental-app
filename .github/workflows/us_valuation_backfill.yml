name: US Valuation Snapshot Backfill

on:
  push:
    paths:
      - "US_VALUATION_TRIGGER.txt"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of valuation rows for this batch"
        required: false
        default: "1000"
        type: string
      start_after:
        description: "Resume after this ticker (exclusive)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: us-valuation-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill US valuation snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          LIMIT="${{ inputs.limit || '1000' }}"
          START_AFTER="${{ inputs.start_after || '' }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -f US_VALUATION_TRIGGER.txt ]; then
            FILE_LIMIT="$(sed -n 's/^limit=//p' US_VALUATION_TRIGGER.txt | head -n 1)"
            FILE_START_AFTER="$(sed -n 's/^start_after=//p' US_VALUATION_TRIGGER.txt | head -n 1)"
            [ -n "$FILE_LIMIT" ] && LIMIT="$FILE_LIMIT"
            [ -n "$FILE_START_AFTER" ] && START_AFTER="$FILE_START_AFTER"
          fi
          ARGS=(collector_us_valuation_all.py --limit "$LIMIT")
          if [ -n "$START_AFTER" ]; then
            ARGS+=(--start-after "$START_AFTER")
          fi
          python "${ARGS[@]}"

      - name: Verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python - <<'PY'
          import os
          from supabase import create_client
          sb=create_client(os.environ["SUPABASE_URL"],os.environ["SUPABASE_KEY"])
          q=sb.table("US_Fundamental").select("ticker",count="exact",head=True).eq("data_unavailable",False).not_.is_("snapshot","null").execute()
          print(f"usable_snapshot_rows={q.count}")
          print("valuation backfill target gate: core inputs only (price, EPS, BPS, current shares, period-end shares)")
          PY
