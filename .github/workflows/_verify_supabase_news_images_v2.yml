name: Verify Supabase Live News Images v2

on:
  push:
    paths:
      - ".github/workflows/_verify_supabase_news_images_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Create temporary Streamlit secrets
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p .streamlit
          printf 'SUPABASE_URL = "%s"\nSUPABASE_KEY = "%s"\n' "$SB_URL" "$SB_KEY" > .streamlit/secrets.toml
      - name: Verify app render path
        run: |
          python - <<'PY'
          import sys
          from streamlit.testing.v1 import AppTest

          at = AppTest.from_file("app.py", default_timeout=120)
          at.run(timeout=120)

          print("EXCEPTIONS", len(at.exception))
          if at.exception:
              print(at.exception[0])
              sys.exit(1)

          html_nodes = at.get("html")
          html = "\n".join(getattr(x, "value", "") for x in html_nodes)
          topic = "storage/v1/object/public/news-topic-images/"
          source = "storage/v1/object/public/news-source-images/"
          print("HTML_NODE_COUNT", len(html_nodes))
          print("LIVE_GRID_COUNT", html.count("live-news-grid"))
          print("TOPIC_STORAGE_COUNT", html.count(topic))
          print("SOURCE_STORAGE_COUNT", html.count(source))
          if "live-news-grid" not in html:
              sys.exit("Live News grid not rendered")
          if topic not in html:
              sys.exit("No Supabase topic fallback image URL rendered")
          print("SUPABASE_NEWS_IMAGE_RENDER_OK")
          PY
      - name: Remove temporary secrets
        if: always()
        run: rm -f .streamlit/secrets.toml
