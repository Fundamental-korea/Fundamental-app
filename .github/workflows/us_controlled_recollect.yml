name: US Safe Filing Recovery Production

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/us_controlled_recollect.yml"

permissions:
  contents: read

jobs:
  recollect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase pandas yfinance lxml
      - name: Recollect forensic-safe filing-recovery targets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          TICKERS=$(grep -v '^#' US_FILING_RECOVERY_SAFE_TARGETS.txt | grep -v '^
          echo "Recovery target count: $(echo "$TICKERS" | tr ',' '\n' | wc -l)"
          python collector_us_fundamental.py --tickers "$TICKERS"
 | paste -sd, -)
          echo "Recovery target count: $(echo "$TICKERS" | tr ',' '\n' | wc -l)"
          python collector_us_fundamental.py --tickers "$TICKERS"
