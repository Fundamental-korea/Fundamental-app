name: US Controlled Production Recollect 4

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/us_controlled_recollect.yml"

permissions:
  contents: read

jobs:
  recollect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase pandas yfinance lxml
      - name: Recollect four controlled cases
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python collector_us_fundamental.py --tickers NTIC,AQB,SB,BOW
